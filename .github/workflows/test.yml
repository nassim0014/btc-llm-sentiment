name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only what the unit tests need (skip heavy ML deps
          # like tensorflow/torch/transformers — the test suite exercises
          # the pure-Python backtest + CV logic only).
          pip install numpy pandas scikit-learn pytest

      - name: Syntax-check all Python files in src/ and scripts/
        run: |
          find src scripts -name "*.py" -print0 | xargs -0 -n1 python -m py_compile
          echo "✅ All Python files compile cleanly"

      - name: Run pytest suite
        run: pytest tests/ -v --tb=short

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python }}
          path: .pytest_cache/
          retention-days: 7
