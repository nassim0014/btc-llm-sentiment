name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # 1. Lint + test + SAST (lightweight, no ML deps)
  # ─────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only what the unit tests need (skip heavy ML deps
          # like tensorflow/torch/transformers — the test suite exercises
          # the pure-Python backtest + CV logic only).
          pip install numpy pandas scikit-learn pytest pytest-cov ruff bandit

      - name: Syntax-check all Python files
        run: |
          find src scripts pages -name "*.py" -print0 | xargs -0 -n1 python -m py_compile
          echo "✅ All Python files compile cleanly"

      - name: Lint (ruff)
        run: ruff check src/ scripts/ tests/

      - name: SAST (bandit)
        run: bandit -r src/ scripts/ -ll -ii -x tests/

      - name: Run pytest suite with coverage
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing --tb=short

      - name: Upload coverage to Codecov
        if: matrix.python == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-py${{ matrix.python }}
          path: .pytest_cache/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 2. ML smoke test — install CPU-only ML deps + import-check
  #
  # Decision #4: install tensorflow-cpu + torch (CPU) so the ML-heavy
  # modules (src/cv/optuna_search.py, src/inference/finbert.py,
  # src/interpretability/shap_explainer.py, src/models/lstm.py) can at
  # least be imported in CI. Catches API mismatches that the lightweight
  # test job can't see. Adds ~3-5 min to CI run time.
  # ─────────────────────────────────────────────
  ml-smoke:
    name: ML import smoke (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install CPU-only ML dependencies
        run: |
          python -m pip install --upgrade pip
          # Core test deps
          pip install numpy pandas scikit-learn pytest
          # CPU-only ML deps (decision #4).
          # tensorflow-cpu was deprecated; the regular `tensorflow` package
          # includes CPU support by default (no GPU drivers unless CUDA is
          # present, which it isn't on ubuntu-latest). ~500MB.
          pip install tensorflow
          # torch CPU-only wheel (no CUDA) from the PyTorch CPU index
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # transformers + shap for the NLP + interpretability modules
          pip install transformers shap

      - name: Import-check all ML modules
        run: |
          python -c "import src.cv.optuna_search; print('✅ optuna_search imports')"
          python -c "import src.inference.finbert; print('✅ finbert imports')"
          python -c "import src.interpretability.shap_explainer; print('✅ shap_explainer imports')"
          python -c "import src.models.lstm; print('✅ lstm imports')"

  # ─────────────────────────────────────────────
  # 2. Security scans
  # ─────────────────────────────────────────────
  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Dependency audit (pip-audit) — blocking on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pip-audit -r requirements.txt --strict

      - name: Dependency audit (pip-audit) — advisory on PRs
        if: github.event_name == 'pull_request'
        run: pip-audit -r requirements.txt --strict
        continue-on-error: true

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # 3. Docker build smoke test
  # ─────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Streamlit image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: btc-llm-sentiment:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (high+crit, fail build)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: btc-llm-sentiment:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.3
        with:
          sarif_file: trivy-results.sarif
