name: Sentiment Alert

on:
  schedule:
    # Daily at 08:00 UTC (09:00 Africa/Tunis)
    - cron: '0 8 * * *'
  workflow_dispatch: # manual trigger

# Read-only — the alert job no longer auto-commits to main.
# Alert logs are uploaded as workflow artifacts instead, which keeps
# main protected from automated pushes (supply-chain hygiene).
permissions:
  contents: read

jobs:
  sentiment-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run sentiment alert check
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/sentiment_alert.py

      - name: Upload alert log as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sentiment-alert-log-${{ github.run_id }}
          path: audit/sentiment_alerts.csv
          if-no-files-found: ignore
          retention-days: 30
