# Streamlit configuration — BTC Sentiment-Driven LSTM Dashboard
# Dark mode theme (best for crypto/financial dashboards)

[theme]
primaryColor = "#00d4ff"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1f2e"
textColor = "#fafafa"
font = "sans serif"

[server]
headless = true
runOnSave = false
port = 8501

[browser]
gatherUsageStats = false
